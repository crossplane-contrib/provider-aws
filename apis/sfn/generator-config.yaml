ignore:
  resource_names:
    - StateMachineAlias
  field_paths:
    - CreateActivityInput.EncryptionConfiguration # has child with jsontag type_ in SDK
    - CreateStateMachineInput.RoleArn
    - CreateStateMachineInput.Type # its jsontag is type_ in SDK and we don't want that.
    - CreateStateMachineInput.EncryptionConfiguration # has child with jsontag type_ in SDK
resources:
  StateMachine:
    exceptions:
      errors:
        404:
          code: StateMachineDoesNotExist
  Activity:
    exceptions:
      errors:
        404:
          code: ActivityDoesNotExist