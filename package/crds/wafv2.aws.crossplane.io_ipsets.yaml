                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: IPSetParameters defines the desired state of IPSet
                properties:
                  addresses:
                    description: |-
                      Contains an array of strings that specifies zero or more IP addresses or
                      blocks of IP addresses that you want WAF to inspect for in incoming requests.
                      All addresses must be specified using Classless Inter-Domain Routing (CIDR)
                      notation. WAF supports all IPv4 and IPv6 CIDR ranges except for /0.

                      Example IPv4 addresses: 1.2.3.4/32, 10.0.0.0/8
                      Example IPv6 addresses: 1111:0000:0000:0000:0000:0000:0000:0111/128, 2001:db8::/32
                    items:
                      type: string
                    type: array
                  description:
                    description: A description of the IP set that helps with identification.
                    type: string
                  ipAddressVersion:
                    description: The version of the IP addresses, either IPV4 or IPV6.
                    enum:
                    - IPV4
                    - IPV6
                    type: string
                  name:
                    description: The name of the IP set. You cannot change the name
                      of an IPSet after you create it.
                    type: string
                  region:
                    description: Region is which region the IPSet will be created.
                    type: string
                  scope:
                    description: |-
                      Specifies whether this is for an Amazon CloudFront distribution or for a
                      regional application.
                    enum:
                    - CLOUDFRONT
                    - REGIONAL
                    type: string
                  tags:
                    description: An array of key:value pairs to associate with the
                      resource.
                    items:
                      properties:
                        key:
